name: Update README cards

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card (including private repos)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=AliHzSec&theme=transparent&show_icons=true&include_all_commits=true&count_private=true&hide_title=true&hide_border=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate top languages card (including private repos)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=AliHzSec&theme=transparent&hide_title=true&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GH_PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
